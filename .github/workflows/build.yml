# Terminator native — CI. Gate for every push: configure + build + tests on macOS arm64 (universal binary,
# lipo-verified), macOS Intel (native x86_64 run of the tests), macOS RTSan (Homebrew LLVM), Windows x64
# (MSVC + WebView2 + ASIO SDK fetched, never committed).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/build/_deps

jobs:
  mac-universal:
    name: macOS universal (arm64 runner)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the React UI (ui/ — typecheck baseline + vite build → ui/dist, bundled into the app)
        run: cd ui && npm ci --no-audit --no-fund && npm run gate
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-mac-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Cache onnxruntime (pinned prebuilt, cmake/Onnxruntime.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.ort-cache
          key: ort-mac-${{ hashFiles('cmake/Onnxruntime.cmake') }}
      - name: Cache the bundled tools (yt-dlp + qjs + lame — pinned, third-party hosts)
        uses: actions/cache@v4
        with:
          path: third_party/.tools-cache
          key: tools-${{ runner.os }}-${{ hashFiles('cmake/ProvisionTools.cmake') }}
      - name: Cache Sparkle (the macOS updater — pinned, cmake/Sparkle.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.sparkle-cache
          key: sparkle-mac-${{ hashFiles('cmake/Sparkle.cmake') }}
      - name: Configure
        run: cmake --preset mac-release-universal
      - name: Build
        run: cmake --build --preset mac-release-universal -j4
      - name: Test
        run: ctest --preset mac-release-universal --timeout 300 --output-on-failure
      - name: Verify universal binaries (lipo)
        run: |
          set -e
          APP="build/mac-release-universal/app/Terminator_artefacts/Release/Terminator.app/Contents/MacOS/Terminator"
          CLI="build/mac-release-universal/tools/terminator-render/terminator-render_artefacts/Release/terminator-render"
          for f in "$APP" "$CLI"; do
            echo "== $f"; lipo -info "$f"
            lipo -info "$f" | grep -q "x86_64" || { echo "::error::missing x86_64 slice in $f"; exit 1; }
            lipo -info "$f" | grep -q "arm64"  || { echo "::error::missing arm64 slice in $f"; exit 1; }
          done
          # the Intel slice of the CLI must run under Rosetta on this arm64 runner
          arch -x86_64 "$CLI" --version
      - name: Smoke — launch the app, probe the WebView + bridge + engine
        env:
          TERMINATOR_PROBE_NET: "1" # + one real YouTube pull through the bundled yt-dlp + qjs (a network miss is a warning)
        run: tools/ci/probe-app.sh "build/mac-release-universal/app/Terminator_artefacts/Release/Terminator.app/Contents/MacOS/Terminator" build/probe-mac.json
      - name: Package app
        run: |
          cd build/mac-release-universal/app/Terminator_artefacts/Release
          ditto -c -k --keepParent Terminator.app Terminator-mac-universal-unsigned.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # the account's artifact storage quota can be full — never fail the gate on it
        with:
          name: Terminator-mac-universal-unsigned
          path: build/mac-release-universal/app/Terminator_artefacts/Release/Terminator-mac-universal-unsigned.zip
          retention-days: 3

  mac-intel:
    name: macOS Intel (x86_64 runner)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the React UI (ui/ — typecheck baseline + vite build → ui/dist, bundled into the app)
        run: cd ui && npm ci --no-audit --no-fund && npm run gate
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-mac-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Cache onnxruntime (pinned prebuilt, cmake/Onnxruntime.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.ort-cache
          key: ort-mac-${{ hashFiles('cmake/Onnxruntime.cmake') }}
      - name: Cache the bundled tools (yt-dlp + qjs + lame — pinned, third-party hosts)
        uses: actions/cache@v4
        with:
          path: third_party/.tools-cache
          key: tools-${{ runner.os }}-${{ hashFiles('cmake/ProvisionTools.cmake') }}
      - name: Cache Sparkle (the macOS updater — pinned, cmake/Sparkle.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.sparkle-cache
          key: sparkle-mac-${{ hashFiles('cmake/Sparkle.cmake') }}
      - name: Configure
        run: cmake --preset mac-release
      - name: Build
        run: cmake --build --preset mac-release -j4
      - name: Test
        run: ctest --preset mac-release --timeout 300 --output-on-failure
      - name: Arch check
        run: |
          CLI="build/mac-release/tools/terminator-render/terminator-render_artefacts/Release/terminator-render"
          lipo -info "$CLI"; lipo -info "$CLI" | grep -q x86_64

  mac-rtsan:
    name: macOS RealtimeSanitizer (Homebrew LLVM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja llvm
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-mac-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Cache onnxruntime (pinned prebuilt, cmake/Onnxruntime.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.ort-cache
          key: ort-mac-${{ hashFiles('cmake/Onnxruntime.cmake') }}
      - name: Cache the bundled tools (yt-dlp + qjs + lame — pinned, third-party hosts)
        uses: actions/cache@v4
        with:
          path: third_party/.tools-cache
          key: tools-${{ runner.os }}-${{ hashFiles('cmake/ProvisionTools.cmake') }}
      - name: Configure (RTSan)
        run: cmake --preset mac-rtsan
      - name: Build
        run: cmake --build --preset mac-rtsan -j4
      - name: Test under RTSan
        run: ctest --preset mac-rtsan --timeout 300 --output-on-failure

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the React UI (ui/ — typecheck baseline + vite build → ui/dist, bundled into the app)
        run: cd ui && npm ci --no-audit --no-fund && npm run gate
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-win-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Cache onnxruntime (pinned prebuilt, cmake/Onnxruntime.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.ort-cache
          key: ort-win-${{ hashFiles('cmake/Onnxruntime.cmake') }}
      - name: Cache the bundled tools (yt-dlp + qjs + lame — pinned, third-party hosts)
        uses: actions/cache@v4
        with:
          path: third_party/.tools-cache
          key: tools-${{ runner.os }}-${{ hashFiles('cmake/ProvisionTools.cmake') }}
      - name: Cache WinSparkle (the Windows updater — pinned, cmake/WinSparkle.cmake)
        uses: actions/cache@v4
        with:
          path: third_party/.winsparkle-cache
          key: winsparkle-${{ hashFiles('cmake/WinSparkle.cmake') }}
      - name: WebView2 SDK (NuGet → JUCE's default search path)
        shell: pwsh
        run: |
          $dest = Join-Path $env:USERPROFILE "AppData\Local\PackageManagement\NuGet\Packages"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          nuget install Microsoft.Web.WebView2 -OutputDirectory $dest -NonInteractive
          Get-ChildItem $dest
      - name: ASIO SDK (Steinberg — fetched, never committed)
        id: asio
        shell: pwsh
        continue-on-error: true
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile $zip -UserAgent "Mozilla/5.0"
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "asiosdk") -Force
          $dir = Get-ChildItem (Join-Path $env:RUNNER_TEMP "asiosdk") -Directory | Select-Object -First 1
          if (-not (Test-Path (Join-Path $dir.FullName "common\iasiodrv.h"))) { throw "iasiodrv.h not found in $($dir.FullName)" }
          "TERMINATOR_ASIO_SDK_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ASIO SDK at $($dir.FullName)"
      - name: ASIO status
        shell: pwsh
        run: |
          if ("${{ steps.asio.outcome }}" -ne "success") { Write-Host "::warning::ASIO SDK download failed — building WITHOUT ASIO (WASAPI/DirectSound only)" }
          else { Write-Host "ASIO SDK ok: $env:TERMINATOR_ASIO_SDK_DIR" }
      - name: Configure
        shell: pwsh
        run: cmake --preset win-release -DTERMINATOR_ASIO_SDK_DIR="$env:TERMINATOR_ASIO_SDK_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build --preset win-release -j4
      - name: Test
        shell: pwsh
        run: ctest --preset win-release --timeout 300 --output-on-failure
      # The Windows app is LAUNCHED here — the only place it ever is — and this is a REAL gate: it passed on
      # 2026-08-25 with the whole engine half green (sequencer, drums, bass, mixer + its PDC plan, licence, an
      # MP3 through the bundled lame.exe, onnxruntime loaded), so a failure from here on is a regression, not a
      # runner quirk. TERMINATOR_NULL_AUDIO=auto is insurance for a runner that turns up without a sound card.
      - name: "Smoke — launch the app, probe the WebView2 + bridge + engine"
        shell: pwsh
        timeout-minutes: 6
        run: |
          $out = "build/probe-win.json"
          $env:TERMINATOR_PROBE_FILE = $out
          $env:TERMINATOR_NULL_AUDIO = "auto"                              # no sound card on a runner
          $env:TERMINATOR_LICENSE_FAKE = "unlocked:probe@terminator.test"   # never a real account / server
          # THE UPDATER (9.1). Unlike Sparkle, WinSparkle does not need a signed build to start, so CI can prove
          # the Windows updater really comes up. Automatic checks are off in this mode — the gate never reaches
          # the network; what it asserts is that the feed and the shared EdDSA key were accepted.
          $env:TERMINATOR_PROBE_UPDATER = "1"
          $p = Start-Process -FilePath "build/win-release/app/Terminator_artefacts/Release/Terminator.exe" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "::error::the app did not quit in 240 s"; exit 1 }
          if (-not (Test-Path $out)) { Write-Host "::error::no probe file written — the app never reached its final read"; exit 1 }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern '"hasJuce": ?true' -Quiet)) { Write-Host "::error::bridge not injected in WebView2"; exit 1 }
          if ((Select-String -Path $out -Pattern '"uiMode": ?"react"' -Quiet) -and -not (Select-String -Path $out -Pattern '"chopperView": ?true' -Quiet)) { Write-Host "::error::React UI served but ChopperView did not render in WebView2"; exit 1 }
          if (-not (Select-String -Path $out -Pattern '"errors": ?\[\]' -Quiet)) { Write-Host "::error::the page reported uncaught errors"; exit 1 }
          $checks = @{
            '"enginePrepared": ?true'          = 'the engine never reached a device';
            '"seqPageOk": ?true'               = 'the page transport did not drive the native chop sequencer';
            '"drumPageOk": ?true'              = 'the drum machine did not drive the native drum sequencer';
            '"bassPageOk": ?true'              = 'the bass did not drive the native bass sequencer/synth';
            '"metroPageOk": ?true'             = 'the metronome / count-in / arp did not run natively';
            '"liveRecOk": ?true'               = 'live record did not land on the engine clock';
            '"mixerPageOk": ?true'             = 'the page mixer did not drive the native mixer (see mixerPdcNums)';
            '"license": ?\{[^}]*"ok": ?true'   = 'the licence bridge did not answer';
            '"licenseSeam": ?\{[^}]*"ok": ?true' = 'the sign-in round trip failed';
            '"export": ?\{[^}]*"ok": ?true'    = 'the offline export failed';
            '"ortLoaded": ?true'               = 'onnxruntime did not load (stems would be unavailable)';
            '"playlistCacheHidden": ?true'     = 'the DL PLAYLIST / DEL cache buttons are showing';
            '"lockedWithoutAccount": ?true'    = 'with no account the app was still unlocked — this build ships free to everybody';
            '"gatedBeforeSignIn": ?true'       = 'with no account the sign-in gate did not appear';
            '"probeUnlock": ?\{[^}]*"ok": ?true' = 'signing in did not unlock the app';
            '"updater": ?\{[^}]*"started": ?true' = 'the WINDOWS updater did not start — a shipped build like this would never update anybody';
          }
          # The page's localStorage holds the FREE-TIER PULL COUNTER and every look-and-feel preference. Under
          # %TEMP% Windows may empty it whenever it likes — free pulls come back forever and a paying user's
          # theme resets — so assert it lives with the rest of the app's data.
          $wv = (Select-String -Path $out -Pattern '"webViewDataDir": ?"([^"]*)"').Matches.Groups[1].Value
          if (-not $wv) { Write-Host "::error::the app did not report where WebView2 keeps the page's localStorage"; exit 1 }
          if ($wv -match '(?i)\\Temp\\') { Write-Host "::error::WebView2 user data is under %TEMP% ($wv) — the free-tier pull counter and every UI preference would be wiped by disk cleanup"; exit 1 }
          Write-Host "webview data: $wv"
          foreach ($check in $checks.Keys) {
            if (-not (Select-String -Path $out -Pattern $check -Quiet)) { Write-Host "::error::windows probe: $($checks[$check])"; exit 1 }
          }
          Write-Host "perf: $((Select-String -Path $out -Pattern '"perf": \{[^}]*\}' -AllMatches).Matches.Value)"
          Write-Host "PROBE OK (windows)"
      - name: Package app
        shell: pwsh
        run: Compress-Archive -Path "build/win-release/app/Terminator_artefacts/Release/Terminator.exe" -DestinationPath "build/Terminator-win-x64-unsigned.zip"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terminator-win-x64-unsigned
          path: build/Terminator-win-x64-unsigned.zip
          retention-days: 3
