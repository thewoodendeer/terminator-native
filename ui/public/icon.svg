<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Black base with safe area for iOS rounding -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Neon green "T" mark with glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#00ff96" stroke-width="32" fill="none" stroke-linecap="square">
    <line x1="120" y1="180" x2="392" y2="180"/>
    <line x1="256" y1="180" x2="256" y2="392"/>
  </g>
  <text x="256" y="460" font-family="monospace" font-size="44" font-weight="700"
        fill="#00ff96" text-anchor="middle" filter="url(#glow)">T-800</text>
</svg>
